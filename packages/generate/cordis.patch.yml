# LDD-owned generation additions. This bundle is installed as a profile layer
# and never rewrites the user's DSH_HOME/cordis.patch.yml.
- insert:
    - id: ldd-generate
      name: '@ldd/dsh-generate'
      config:
        # 61 min: Legnext BYOK queues for the bound MJ account up to 1 hour
        # when busy (docs). KIE/Suno poll loops self-limit at ~10 min, so the
        # wider ceiling only affects Legnext and long-poll providers.
        timeoutMs: 3660000

    - id: ldd-generate-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: ldd-generate
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@ldd/dsh-generate/package.json')), 'skills')"
        watch: false
