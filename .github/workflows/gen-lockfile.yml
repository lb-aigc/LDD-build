name: Gen lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen-lockfile:
    runs-on: windows-2022
    steps:
      - name: Check out approved source
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Use pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Regenerate lockfile
        shell: pwsh
        run: pnpm install --lockfile-only --no-frozen-lockfile --config.block-exotic-subdeps=false

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7
