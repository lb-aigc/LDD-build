name: Gen lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen-lockfile:
    runs-on: windows-2022
    steps:
      - name: Check out approved source
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Use pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Regenerate lockfile
        shell: pwsh
        run: pnpm install --lockfile-only --no-frozen-lockfile --config.block-exotic-subdeps=false

      - name: Commit and push regenerated lockfile
        shell: pwsh
        run: |
          git config user.name "LDD Windows Builder"
          git config user.email "l386340171@gmail.com"
          if (git diff --quiet -- pnpm-lock.yaml) {
            Write-Host 'lockfile unchanged; nothing to commit'
          } else {
            git add pnpm-lock.yaml
            git commit -m "chore: regenerate pnpm-lock.yaml (skill picker + file upload deps)"
            git push
            Write-Host 'pushed regenerated lockfile'
          }
