name: Build LDD macOS release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Check out approved source
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Use pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --config.block-exotic-subdeps=false

      - name: Verify repository before packaging
        run: pnpm verify:release

      - name: Build runtime and macOS installer
        run: pnpm dist:mac

      - name: Diagnose worktree state after build (always)
        if: always()
        run: |
          echo '=== git status (porcelain, all) ==='
          git status --porcelain=v1 --untracked-files=all
          echo '=== git status (short) ==='
          git status --short
          echo '=== git diff --stat (tracked changes) ==='
          git diff --stat
          echo '=== done ==='

      - name: Smoke-test installed Harness runtime (real plugin-tree load)
        run: |
          dshEntry='dist/runtime/0.1.1-rc.2/node_modules/@deepseek-ai/dsh/lib/bin.js'
          if [ ! -f "$dshEntry" ]; then
            echo "Missing installed Harness entry: $dshEntry"; exit 1
          fi

          imageModeJs='apps/desktop/dist/main/src/main/profile/image-mode.js'
          if [ ! -f "$imageModeJs" ]; then
            echo "Missing compiled image-mode module: $imageModeJs"; exit 1
          fi

          smokeDir="$RUNNER_TEMP/ldd-harness-smoke"
          mkdir -p "$smokeDir"
          managedPatch="$smokeDir/cordis.patch.yml"
          genScript="$smokeDir/gen-patch.mjs"
          cat > "$genScript" <<'EOF'
          import { writeFileSync } from 'node:fs'
          import { resolve } from 'node:path'
          import { pathToFileURL } from 'node:url'
          const target = pathToFileURL(resolve(process.argv[2]))
          const mod = await import(target)
          writeFileSync(process.argv[3], mod.renderManagedImagePatch('standard'))
          EOF
          node "$genScript" "$imageModeJs" "$managedPatch" || { echo 'Failed to render the managed patch'; exit 1; }
          if [ ! -f "$managedPatch" ]; then echo 'Managed patch was not written'; exit 1; fi

          dshHome="$smokeDir/home"
          mkdir -p "$dshHome"
          export DSH_HOME="$dshHome"
          export LDD_RUNTIME_VERSION='0.1.1-rc.2'
          export LDD_IMAGE_MODE='standard'
          export LDD_IDENTITY_NONCE='ldd-ci-smoke-nonce-0123456789abcdef'
          export LDD_FFMPEG_PATH='/usr/bin/true'
          export LDD_FFPROBE_PATH='/usr/bin/true'

          port=3199
          stdoutLog="$smokeDir/dsh-stdout.log"
          stderrLog="$smokeDir/dsh-stderr.log"
          node "$dshEntry" web --patch "$managedPatch" --host 127.0.0.1 --port "$port" --no-open \
            > "$stdoutLog" 2> "$stderrLog" &
          dshPid=$!

          ready=false
          deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$dshPid" 2>/dev/null; then
              echo '=== dsh stdout ==='; cat "$stdoutLog"
              echo '=== dsh stderr ==='; cat "$stderrLog"
              echo 'Harness exited before readiness'; exit 1
            fi
            if curl -s "http://127.0.0.1:$port/__ldd/identity" 2>/dev/null | grep -q 'LDD-Harness'; then
              ready=true; break
            fi
            sleep 0.5
          done

          if [ "$ready" != "true" ]; then
            echo '=== dsh stdout ==='; cat "$stdoutLog"
            echo '=== dsh stderr ==='; cat "$stderrLog"
            kill "$dshPid" 2>/dev/null || true
            echo 'Harness did not become ready within 120s (plugin tree failed to load)'; exit 1
          fi

          echo "Harness ready: http://127.0.0.1:$port/__ldd/identity -> product=LDD-Harness"
          kill "$dshPid" 2>/dev/null || true

      - name: Verify required release artifacts
        run: |
          required=(
            'release/LDD-Setup-0.2.0-arm64.dmg'
            'release/deepseek-harness-0.1.1-rc.2-darwin-arm64.lddruntime'
            'release/LDD-0.2.0-source.zip'
            'release/checksums.sha256'
          )
          for path in "${required[@]}"; do
            if [ ! -f "$path" ]; then echo "Missing release artifact: $path"; exit 1; fi
            if [ ! -s "$path" ]; then echo "Empty release artifact: $path"; exit 1; fi
            hash=$(shasum -a 256 "$path" | awk '{print $1}')
            echo "$hash  $path"
          done

      - name: Upload private build artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: LDD-0.2.0-macos-arm64
          path: |
            release/LDD-Setup-0.2.0-arm64.dmg
            release/deepseek-harness-0.1.1-rc.2-darwin-arm64.lddruntime
            release/LDD-0.2.0-source.zip
            release/checksums.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish to GitHub Release (quota-proof fallback)
        uses: ncipollo/release-action@v1
        with:
          tag: v0.2.0-macos
          name: LDD 0.2.0 macOS (arm64)
          body: |
            LDD 0.2.0 macOS arm64 (unsigned — right-click → Open on first launch)
            Commit: ${{ github.sha }}
          artifacts: "release/LDD-Setup-0.2.0-arm64.dmg,release/deepseek-harness-0.1.1-rc.2-darwin-arm64.lddruntime,release/LDD-0.2.0-source.zip,release/checksums.sha256"
          allowUpdates: true
          removeArtifacts: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
